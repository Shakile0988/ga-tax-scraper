name: Scrape GA Property Tax Bill

# Triggered two ways:
# 1) Manually from the GitHub UI (Actions tab -> Run workflow)
# 2) Remotely from n8n, by calling the GitHub API:
#
#    POST https://api.github.com/repos/<owner>/<repo>/actions/workflows/scrape.yml/dispatches
#    Headers:
#      Authorization: Bearer <GITHUB_PERSONAL_ACCESS_TOKEN>
#      Accept: application/vnd.github+json
#    Body:
#      {
#        "ref": "main",
#        "inputs": {
#          "parcel_id": "152 0114",
#          "tax_year": "2021",
#          "callback_url": "https://<your-n8n-domain>/webhook/ga-tax-result"
#        }
#      }
#
# The workflow scrapes the site, then POSTs the JSON result to callback_url
# (an n8n Webhook node), so n8n receives the data with no server/VPS needed.

on:
  workflow_dispatch:
    inputs:
      parcel_id:
        description: "Map/Parcel/Property ID, e.g. '152 0114'"
        required: true
      tax_year:
        description: "Tax year, e.g. '2021'"
        required: true
      callback_url:
        description: "n8n Webhook URL to receive the JSON result"
        required: false
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper and callback to n8n
        run: |
          python run_and_callback.py \
            --parcel-id "${{ github.event.inputs.parcel_id }}" \
            --tax-year "${{ github.event.inputs.tax_year }}" \
            --callback-url "${{ github.event.inputs.callback_url }}"

      - name: Upload result as artifact (backup, in case callback fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-result
          path: result.json
          if-no-files-found: ignore
